[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "scientific-api"
version = "2.0.0"
description = "Reproducible API for computational physics experiments"
readme = "README.EN.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Artem Alimpiev", email = "alimpievne@gmail.com" },
]
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "numpy>=2.1.0,<3",
]

[project.optional-dependencies]
tracking = ["mlflow>=3.17.1,<4"]
redis = ["redis>=5.0.0,<8"]
research = ["matplotlib>=3.9.0,<4"]
notebooks = [
    "jupyter>=1.0.0,<2",
    "papermill>=2.6.0,<3",
    "jupytext>=1.16.0,<2",
]
observability = [
    "opentelemetry-api>=1.39.0,<2",
    "opentelemetry-sdk>=1.39.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<2",
]
benchmark = [
    "numba>=0.61.0,<1",
    "jax>=0.5.0,<1",
]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "httpx>=0.27.0,<1",
    "ruff>=0.6.0,<1",
    "pyright>=1.1.0,<2",
    "build>=1.2.0,<2",
]

[project.urls]
Repository = "https://github.com/Artem7898/scientific_fastapi"
Issues = "https://github.com/Artem7898/scientific_fastapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/scientific_api",
    "/tests",
    "/scripts/*.py",
    "/docs",
    "/README.md",
    "/README.EN.md",
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/LICENSE",
    "/uv.lock",
]

[tool.uv]
required-version = "==0.12.23"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src/scientific_api"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
