name: Validate scientific API

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      optional_benchmarks:
        description: Run Numba/JAX and free-threaded Python benchmark experiments
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SCIENTIFIC_TEST_REDIS_URI: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependency resolution
        run: uv sync --frozen --extra dev --extra redis --extra tracking --extra research --extra observability --extra numba
      - name: Confirm lockfile matches package metadata
        run: uv lock --check
      - name: Lint and type check
        run: |
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync pyright
      - name: Test scientific, API and artifact contracts
        run: uv run --frozen --no-sync pytest
      - name: Regenerate a small research run
        run: uv run --frozen --no-sync python scripts/run_paper_pipeline.py --output-dir /tmp/paper-smoke --seed 42 --num-points 3 --num-particles 48 --num-steps 5
      - name: Check benchmark backends produce equivalent results
        run: uv run --frozen --no-sync python scripts/benchmark.py --particles 64 --steps 4 --repeats 2 --workers 2 --backends numpy,threads,processes --output /tmp/benchmark-smoke.json
      - name: Verify the real NumPy and Numba runtime backends
        run: uv run --frozen --no-sync python scripts/benchmark_runtime.py --particles 64 --steps 4 --repeats 2 --backends numpy,numba --require-backends --output /tmp/runtime-smoke.json
      - name: Verify LJ reference and optimized interaction paths
        run: uv run --frozen --no-sync python scripts/benchmark_lj.py --particles 36 --steps 4 --repeats 2 --variants numpy-direct,numpy-verlet,numba-direct,numba-verlet --require-backends --output /tmp/lj-benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-benchmark-${{ matrix.python }}
          path: |
            /tmp/runtime-smoke.json
            /tmp/lj-benchmark-smoke.json
          if-no-files-found: ignore
      - name: Export a portable PEP 751 lock
        run: uv export --frozen --format pylock.toml --no-editable --no-emit-project --output-file /tmp/pylock.toml
      - name: Build distributions with the pinned backend
        run: uv build
      - name: Import installed wheel outside checkout
        shell: bash
        run: |
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          source_checkout="$PWD"
          uv venv --python "${{ matrix.python }}" /tmp/scientific-wheel
          uv export --frozen --no-emit-project --output-file /tmp/scientific-core.txt
          uv pip install --python /tmp/scientific-wheel/bin/python --require-hashes -r /tmp/scientific-core.txt
          uv pip install --python /tmp/scientific-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          EXPECTED_PACKAGE_VERSION="$expected_version" /tmp/scientific-wheel/bin/python -I "$source_checkout/tests/packaging/probe_core_wheel.py"
      - name: Ensure frozen operations preserved the lock
        run: git diff --exit-code -- uv.lock

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the default API and Redis stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Submit a task, poll its state and download its manifest
        run: |
          python - <<'PYTHON'
          import hashlib
          import io
          import json
          import time
          import urllib.error
          import urllib.request
          import zipfile

          base = "http://127.0.0.1:8000"
          with urllib.request.urlopen(base + "/api/v1/models", timeout=5) as response:
              catalog = json.load(response)
          assert {model["model_version"] for model in catalog["models"]} == {
              "ideal-gas-ou-v1", "langevin-free-v1", "lennard-jones-2d-v1",
          }
          assert all(model["default_backend"] == "numpy" for model in catalog["models"])
          available = {entry["backend"]: entry for entry in catalog["backend_availability"]}
          assert available["numpy"]["dependency_present"] is True
          assert available["numba"]["dependency_present"] is False
          assert all(entry["worker_readiness"] == "not_checked" for entry in available.values())
          invalid = urllib.request.Request(
              base + "/api/v1/simulations/monte-carlo",
              data=b'{"initial_temperature":300.0,"num_particles":24,"time_step":1e309}',
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(invalid, timeout=5)
              raise AssertionError("Nonfinite input was accepted")
          except urllib.error.HTTPError as error:
              assert error.code == 422
              assert isinstance(json.load(error)["detail"], list)
          unavailable = urllib.request.Request(
              base + "/api/v1/simulations/monte-carlo",
              data=b'{"initial_temperature":1.0,"num_particles":4,"backend":"numba"}',
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(unavailable, timeout=5)
              raise AssertionError("The default image unexpectedly accepted optional Numba")
          except urllib.error.HTTPError as error:
              assert error.code == 503
              assert "scientific-api[numba]" in json.load(error)["detail"]
          payload = {"initial_temperature": 300.0, "num_particles": 24, "num_steps": 3, "seed": 42}
          request = urllib.request.Request(
              base + "/api/v1/simulations/monte-carlo",
              data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 202
              accepted = json.load(response)
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              with urllib.request.urlopen(base + accepted["check_url"], timeout=5) as response:
                  result = json.load(response)
              if result["status"] == "completed":
                  break
              assert result["status"] in {"pending", "running"}, result
              time.sleep(0.1)
          else:
              raise AssertionError("Container task did not finish")
          assert result["task_id"] == accepted["task_id"]
          checkpoint_url = base + "/api/v1/simulations/" + result["task_id"] + "/checkpoints"
          with urllib.request.urlopen(checkpoint_url, timeout=5) as response:
              checkpoints = json.load(response)
          assert checkpoints["checkpoints"] == []
          assert checkpoints["integrity_status"] == "recorded_not_rechecked"
          resume = urllib.request.Request(
              base + "/api/v1/simulations/" + result["task_id"] + "/resume",
              data=b'{}', headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(resume, timeout=5)
              raise AssertionError("A completed task was reopened through resume")
          except urllib.error.HTTPError as error:
              assert error.code == 409
              assert json.load(error)["detail"]["code"] == "RESUME_STATE_CONFLICT"
          prefix = result["task_id"] + "/" + result["attempt_id"] + "/"
          assert all(path.startswith(prefix) for path in result["artifacts"].values())
          artifact = base + "/api/v1/simulations/" + accepted["task_id"] + "/artifacts/"
          with urllib.request.urlopen(artifact + "manifest", timeout=5) as response:
              manifest = json.load(response)
          with urllib.request.urlopen(artifact + "final_state", timeout=5) as response:
              digest = hashlib.sha256(response.read()).hexdigest()
          assert digest == manifest["artifacts"][0]["sha256"]
          evidence_url = base + "/api/v1/simulations/" + result["task_id"] + "/envelope"
          with urllib.request.urlopen(evidence_url, timeout=5) as response:
              assert response.headers["Cache-Control"] == "no-store"
              envelope = json.load(response)
          assert envelope["result"] == result
          assert envelope["integrity"]["status"] == "verified"
          assert envelope["authenticity"] == "unsigned"
          assert envelope["scientific_verification"] == "not_performed"
          with urllib.request.urlopen(artifact + "manifest", timeout=5) as response:
              assert envelope["manifest"]["sha256"] == hashlib.sha256(response.read()).hexdigest()
          analysis_url = base + "/api/v1/simulations/" + result["task_id"] + "/analyses"
          request = urllib.request.Request(
              analysis_url, data=b'{"bins":4,"formats":[]}',
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 201
              analysis = json.load(response)
          with urllib.request.urlopen(analysis_url + "/" + analysis["analysis_id"] + "/envelope", timeout=5) as response:
              analysis_envelope = json.load(response)
          assert analysis_envelope["kind"] == "velocity_analysis"
          assert analysis_envelope["analysis_id"] == analysis["analysis_id"]
          assert analysis_envelope["integrity"]["status"] == "verified"
          provenance_url = base + "/api/v1/provenance/tasks/" + result["task_id"]
          with urllib.request.urlopen(provenance_url, timeout=5) as response:
              provenance = json.load(response)
          assert provenance["record"] == result
          assert provenance["coverage"] == "complete" and provenance["storage"] == "redis"
          assert provenance["evidence_status"] == "verified"
          assert analysis["analysis_id"] in {item["analysis_id"] for item in provenance["analyses"]}
          with urllib.request.urlopen(provenance_url + "/graph", timeout=5) as response:
              graph = json.load(response)
          assert graph["@context"] and graph["@graph"]
          timeline_url = base + "/api/v1/tasks/" + result["task_id"] + "/timeline"
          with urllib.request.urlopen(timeline_url + "?limit=2", timeout=5) as response:
              page = json.load(response)
          assert len(page["events"]) == 2 and page["has_more"]
          with urllib.request.urlopen(timeline_url + "?after_id=" + page["next_cursor"], timeout=5) as response:
              remaining = json.load(response)
          assert {event["event_type"] for event in page["events"] + remaining["events"]} >= {
              "submitted", "attempt_claimed", "completed", "analysis_completed",
          }
          record = provenance["artifacts"][0]
          with urllib.request.urlopen(base + "/api/v1/provenance/artifacts/" + record["artifact_id"], timeout=5) as response:
              assert json.load(response) == record
          with urllib.request.urlopen(base + "/api/v1/provenance/analyses/" + analysis["analysis_id"], timeout=5) as response:
              assert json.load(response)["evidence_status"] == "verified"
          with urllib.request.urlopen(provenance_url + "/export", timeout=10) as response:
              package = response.read()
          archive_sha256 = hashlib.sha256(package).hexdigest()
          with zipfile.ZipFile(io.BytesIO(package)) as archive:
              assert {"ro-crate-metadata.json", "provenance.jsonld", "task.json", "model-contract.json"} <= set(archive.namelist())
              assert json.loads(archive.read("task.json"))["record"] == result
              for record in [*provenance["artifacts"], *provenance["analyses"][0]["artifacts"]]:
                  assert hashlib.sha256(archive.read(record["path"])).hexdigest() == record["sha256"]
          with open("/tmp/container-task.json", "w") as stream:
              json.dump({"task_id": result["task_id"], "attempt_id": result["attempt_id"], "sha256": digest, "analysis_id": analysis["analysis_id"], "archive_sha256": archive_sha256}, stream)
          print("Container model catalog, envelopes, archived provenance, timeline and RO-Crate passed")
          PYTHON
      - name: Verify Langevin HTTP results and transport artifacts
        run: |
          python - <<'PYTHON'
          import hashlib
          import io
          import json
          import time
          import urllib.request
          import zipfile

          base = "http://127.0.0.1:8000"
          payload = {
              "initial_temperature": 1.0, "bath_temperature": 1.0,
              "num_particles": 32, "num_steps": 100, "time_step": 0.1,
              "sample_stride": 10, "seed": 42, "acceleration": [0.5, -0.25],
              "boundary": "periodic", "box_size": [1.0, 1.0],
          }
          request = urllib.request.Request(
              base + "/api/v1/simulations/langevin", data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 202
              accepted = json.load(response)
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              with urllib.request.urlopen(base + accepted["check_url"], timeout=5) as response:
                  result = json.load(response)
              if result["status"] == "completed":
                  break
              assert result["status"] in {"pending", "running"}, result
              time.sleep(0.1)
          else:
              raise AssertionError("Container Langevin task did not finish")
          assert result["task_id"] == accepted["task_id"]
          assert result["model_version"] == "langevin-free-v1"
          assert set(result["artifacts"]) == {"manifest", "final_state", "trajectory", "transport"}
          artifact = base + "/api/v1/simulations/" + result["task_id"] + "/artifacts/"
          with urllib.request.urlopen(artifact + "manifest", timeout=5) as response:
              manifest = json.load(response)
          assert manifest["model"]["version"] == "langevin-free-v1"
          assert manifest["parameters"]["acceleration"] == payload["acceleration"]
          assert manifest["execution"]["backend"] == "numpy"
          assert manifest["sampling"]["coordinate_convention"] == "unwrapped"
          records = {entry["path"]: entry for entry in manifest["artifacts"]}
          hashes = {}
          artifacts = {}
          for name in ("trajectory", "transport"):
              with urllib.request.urlopen(artifact + name, timeout=5) as response:
                  artifacts[name] = response.read()
              hashes[name] = hashlib.sha256(artifacts[name]).hexdigest()
              assert hashes[name] == records[result["artifacts"][name]]["sha256"]
          transport = json.loads(artifacts["transport"])
          assert transport["model_version"] == result["model_version"]
          assert transport["coordinate_convention"] == "unwrapped"
          assert transport["msd"][-1] == result["final_msd"]
          assert transport["centered_msd"][-1] == result["final_centered_msd"]
          assert transport["sample_steps"] == list(range(0, 101, 10))
          with urllib.request.urlopen(base + "/api/v1/simulations/" + result["task_id"] + "/envelope", timeout=5) as response:
              envelope = json.load(response)
          assert envelope["result"] == result
          assert envelope["integrity"]["status"] == "verified"
          with urllib.request.urlopen(artifact + "manifest", timeout=5) as response:
              assert envelope["manifest"]["sha256"] == hashlib.sha256(response.read()).hexdigest()
          with zipfile.ZipFile(io.BytesIO(artifacts["trajectory"])) as archive:
              assert set(archive.namelist()) == {"positions.npy", "sample_steps.npy", "times.npy"}
          with open("/tmp/container-langevin-task.json", "w") as stream:
              json.dump({"task_id": result["task_id"], "attempt_id": result["attempt_id"], "hashes": hashes}, stream)
          print("Langevin HTTP response, sampled trajectory and transport checksums passed")
          PYTHON
      - name: Verify Lennard-Jones HTTP results and signed observables
        run: |
          python - <<'PYTHON'
          import hashlib
          import io
          import json
          import math
          import time
          import urllib.request
          import zipfile

          base = "http://127.0.0.1:8000"
          payload = {
              "num_particles": 36, "box_size": [8.0, 8.0], "initial_temperature": 0.1,
              "num_steps": 6, "time_step": 0.001, "sample_stride": 1, "seed": 42,
          }
          request = urllib.request.Request(
              base + "/api/v1/simulations/lennard-jones", data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 202
              accepted = json.load(response)
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              with urllib.request.urlopen(base + accepted["check_url"], timeout=5) as response:
                  result = json.load(response)
              if result["status"] == "completed":
                  break
              assert result["status"] in {"pending", "running"}, result
              time.sleep(0.1)
          else:
              raise AssertionError("Container Lennard-Jones task did not finish")
          assert result["task_id"] == accepted["task_id"]
          assert result["model_version"] == "lennard-jones-2d-v1"
          assert result["ensemble"] == "nve"
          assert result["potential_energy"] < 0 and result["total_energy"] < 0
          assert result["kinetic_energy"] >= 0 and math.isfinite(result["pressure"])
          assert set(result["artifacts"]) == {"manifest", "final_state", "trajectory", "observables"}
          artifact = base + "/api/v1/simulations/" + result["task_id"] + "/artifacts/"
          with urllib.request.urlopen(artifact + "manifest", timeout=5) as response:
              manifest = json.load(response)
          assert manifest["outputs"] == result
          assert manifest["model"]["integrator"] == "velocity-verlet"
          assert "shifted-force" in manifest["model"]["potential"]["name"]
          assert manifest["execution"]["backend"] == "numpy"
          records = {entry["path"]: entry for entry in manifest["artifacts"]}
          hashes = {}
          artifacts = {}
          for name in ("final_state", "trajectory", "observables"):
              with urllib.request.urlopen(artifact + name, timeout=5) as response:
                  artifacts[name] = response.read()
              hashes[name] = hashlib.sha256(artifacts[name]).hexdigest()
              assert hashes[name] == records[result["artifacts"][name]]["sha256"]
          observed = json.loads(artifacts["observables"])
          assert observed["series"]["total_energy"][-1] == result["total_energy"]
          assert observed["series"]["pressure"][-1] == result["pressure"]
          assert observed["rdf"]["dimensions"] == 2
          assert observed["energy_drift"]["applicable"] is True
          assert observed["sample_steps"] == list(range(7))
          with urllib.request.urlopen(base + "/api/v1/simulations/" + result["task_id"] + "/envelope", timeout=5) as response:
              envelope = json.load(response)
          assert envelope["result"] == result
          assert envelope["integrity"]["status"] == "verified"
          assert envelope["uncertainty"]["availability"] == "unavailable"
          assert envelope["uncertainty"]["reason"]
          with urllib.request.urlopen(artifact + "manifest", timeout=5) as response:
              assert envelope["manifest"]["sha256"] == hashlib.sha256(response.read()).hexdigest()
          with zipfile.ZipFile(io.BytesIO(artifacts["trajectory"])) as archive:
              assert set(archive.namelist()) == {"positions.npy", "sample_steps.npy", "times.npy"}
          with open("/tmp/container-lj-task.json", "w") as stream:
              json.dump({"task_id": result["task_id"], "attempt_id": result["attempt_id"], "hashes": hashes}, stream)
          print("LJ HTTP response, signed energy, RDF and artifact checksums passed")
          PYTHON
      - name: Verify task state and artifacts survive API and Redis restart
        run: |
          docker compose restart redis api
          docker compose up --detach --no-build --wait --wait-timeout 120
          python - <<'PYTHON'
          import hashlib
          import json
          import urllib.request

          with open("/tmp/container-task.json") as stream:
              expected = json.load(stream)
          base = "http://127.0.0.1:8000/api/v1/simulations/"
          with urllib.request.urlopen(base + "status/" + expected["task_id"], timeout=5) as response:
              result = json.load(response)
          assert result["status"] == "completed"
          assert result["attempt_id"] == expected["attempt_id"]
          provenance_url = "http://127.0.0.1:8000/api/v1/provenance/tasks/" + expected["task_id"]
          with urllib.request.urlopen(provenance_url, timeout=5) as response:
              provenance = json.load(response)
          assert provenance["record"] == result
          assert provenance["coverage"] == "complete"
          assert expected["analysis_id"] in {item["analysis_id"] for item in provenance["analyses"]}
          with urllib.request.urlopen(provenance_url + "/export", timeout=10) as response:
              assert hashlib.sha256(response.read()).hexdigest() == expected["archive_sha256"]
          with urllib.request.urlopen(base + expected["task_id"] + "/envelope", timeout=5) as response:
              assert json.load(response)["integrity"]["status"] == "verified"
          analysis_path = base + expected["task_id"] + "/analyses/" + expected["analysis_id"] + "/envelope"
          with urllib.request.urlopen(analysis_path, timeout=5) as response:
              assert json.load(response)["integrity"]["status"] == "verified"
          with urllib.request.urlopen(base + expected["task_id"] + "/artifacts/final_state", timeout=5) as response:
              assert hashlib.sha256(response.read()).hexdigest() == expected["sha256"]
          with open("/tmp/container-langevin-task.json") as stream:
              expected = json.load(stream)
          with urllib.request.urlopen(base + "status/" + expected["task_id"], timeout=5) as response:
              result = json.load(response)
          assert result["status"] == "completed" and result["model_version"] == "langevin-free-v1"
          assert result["attempt_id"] == expected["attempt_id"]
          with urllib.request.urlopen(base + expected["task_id"] + "/envelope", timeout=5) as response:
              assert json.load(response)["integrity"]["status"] == "verified"
          for name, digest in expected["hashes"].items():
              with urllib.request.urlopen(base + expected["task_id"] + "/artifacts/" + name, timeout=5) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == digest
          with open("/tmp/container-lj-task.json") as stream:
              expected = json.load(stream)
          with urllib.request.urlopen(base + "status/" + expected["task_id"], timeout=5) as response:
              result = json.load(response)
          assert result["status"] == "completed" and result["model_version"] == "lennard-jones-2d-v1"
          assert result["attempt_id"] == expected["attempt_id"]
          with urllib.request.urlopen(base + expected["task_id"] + "/envelope", timeout=5) as response:
              assert json.load(response)["integrity"]["status"] == "verified"
          assert result["potential_energy"] < 0 and result["total_energy"] < 0
          for name, digest in expected["hashes"].items():
              with urllib.request.urlopen(base + expected["task_id"] + "/artifacts/" + name, timeout=5) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == digest
          print("OU/Langevin/LJ Redis state, archive, analysis lineage and RO-Crate survived restart")
          PYTHON
      - name: Verify separate worker, ensembles and SSE in the container stack
        run: |
          docker compose -f docker-compose.yml -f compose.worker.yml up --build --detach --wait --wait-timeout 180 api redis
          python - <<'PYTHON'
          import json
          import subprocess
          import time
          import urllib.request

          compose = ["docker", "compose", "-f", "docker-compose.yml", "-f", "compose.worker.yml"]
          subprocess.run([*compose, "stop", "worker"], check=True)
          base = "http://127.0.0.1:8000"

          def read(path):
              with urllib.request.urlopen(base + path, timeout=5) as response:
                  return json.load(response)

          payload = {
              "model": "ideal-gas-ou-v1",
              "parameters": {"initial_temperature": 1.0, "num_particles": 32, "num_steps": 3},
              "replicas": 3, "base_seed": 2**64 - 1,
          }
          request = urllib.request.Request(
              base + "/api/v1/ensembles", data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "Idempotency-Key": "container-ensemble"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 202
              accepted = json.load(response)
          time.sleep(0.2)
          assert read(accepted["check_url"])["counts"]["pending"] == 3
          subprocess.run([*compose, "up", "--build", "--detach", "worker"], check=True)
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              result = read(accepted["check_url"])
              if result["status"] == "completed":
                  break
              assert result["status"] in {"pending", "running"}, result
              time.sleep(0.1)
          else:
              raise AssertionError("Separate worker did not finish the ensemble")
          assert result["counts"]["completed"] == 3
          manifest = read(accepted["check_url"] + "/manifest")
          assert manifest["outputs"] == result
          assert manifest["seeds"] == [child["seed"] for child in result["children"]]
          for child in result["children"]:
              task_id = child["task_id"]
              source = read(f"/api/v1/simulations/{task_id}/artifacts/manifest")
              assert source["parameters"]["seed"] == child["seed"]
              assert source["outputs"]["attempt_id"] == child["result"]["attempt_id"]
          path = "/api/v1/simulations/" + result["children"][0]["task_id"] + "/events"
          with urllib.request.urlopen(base + path, timeout=5) as response:
              assert response.headers["Content-Type"].startswith("text/event-stream")
              stream = response.read().decode()
          assert '"phase":"saving_artifacts"' in stream
          assert '"status":"completed"' in stream
          first_id = next(line[4:] for line in stream.splitlines() if line.startswith("id: "))
          reconnect = urllib.request.Request(base + path, headers={"Last-Event-ID": first_id})
          with urllib.request.urlopen(reconnect, timeout=5) as response:
              replay = response.read().decode()
          assert '"status":"completed"' in replay
          assert not any(line == "id: " + first_id for line in replay.splitlines())
          print("Separate worker, ensemble provenance, uint64 seeds and SSE replay passed")
          PYTHON
      - name: Show container logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.worker.yml logs --no-color
      - name: Remove CI containers and generated volumes
        if: always()
        run: docker compose -f docker-compose.yml -f compose.worker.yml down --volumes

  numba-container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the optional Numba runtime image
        run: docker build --build-arg INSTALL_NUMBA=true --tag scientific-api:numba-ci .
      - name: Verify compiled CPU execution as the image user
        run: |
          docker run --rm -i --entrypoint python scientific-api:numba-ci - <<'PYTHON'
          import hashlib
          import importlib.metadata
          import importlib.util
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          import numpy as np
          import scientific_api
          from scientific_api.domain.langevin import LangevinParameters
          from scientific_api.domain.lennard_jones import LennardJonesParameters
          from scientific_api.domain.simulation import SimulationParameters
          from scientific_api.research.lj_analysis import analyze_lj_observables
          from scientific_api.research.transport_analysis import analyze_transport, load_trajectory_state
          from scientific_api.services.checkpoint_service import CheckpointControl, load_checkpoint
          from scientific_api.services.result_envelope_service import read_result_envelope
          from scientific_api.services.simulation_service import run_simulation

          assert importlib.util.find_spec("jax") is None
          assert importlib.util.find_spec("jaxlib") is None
          assert not os.access(Path(scientific_api.__file__).parent, os.W_OK)
          states = {}
          manifests = {}

          def verify_envelope(result, root):
              envelope = read_result_envelope(result, artifacts_dir=root, require_present=True)
              assert envelope.integrity.status == "verified"
              assert envelope.result.model_dump(mode="json") == result
              assert envelope.authenticity == "unsigned"
              assert envelope.scientific_verification == "not_performed"
              assert envelope.manifest.sha256 == hashlib.sha256(
                  (root / result["artifacts"]["manifest"]).read_bytes()
              ).hexdigest()

          def verify_checkpoint_resume(parameters, reference, root):
              registered = []

              class InterruptedAfterCheckpoint(RuntimeError):
                  pass

              def register(descriptor):
                  registered.append(descriptor)
                  if descriptor["completed_steps"] > 0:
                      raise InterruptedAfterCheckpoint
                  return True

              task_id = reference["task_id"] + "_checkpoint"
              control = CheckpointControl(
                  parameters, task_id=task_id, attempt_id="interrupted", artifacts_dir=root,
                  interval_steps=1, register=register,
              )
              try:
                  run_simulation(
                      parameters, task_id=task_id, attempt_id="interrupted", artifacts_dir=root,
                      checkpoint_control=control,
                  )
              except InterruptedAfterCheckpoint:
                  pass
              else:
                  raise AssertionError("The controlled checkpoint interruption did not occur")
              descriptor = registered[-1]
              assert 0 < descriptor["completed_steps"] < parameters.num_steps
              loaded = load_checkpoint(descriptor, parameters=parameters, artifacts_dir=root)
              resumed_control = CheckpointControl(
                  parameters, task_id=task_id, attempt_id="resumed", artifacts_dir=root,
                  loaded=loaded,
              )
              resumed = run_simulation(
                  parameters, task_id=task_id, attempt_id="resumed", artifacts_dir=root,
                  checkpoint_control=resumed_control,
              )
              verify_envelope(resumed, root)
              for name in reference.keys() - {"task_id", "attempt_id", "artifacts"}:
                  assert resumed[name] == reference[name], name
              for name, relative in reference["artifacts"].items():
                  if name == "manifest":
                      continue
                  original_path = root / relative
                  resumed_path = root / resumed["artifacts"][name]
                  if original_path.suffix == ".npz":
                      with np.load(original_path, allow_pickle=False) as original, np.load(resumed_path, allow_pickle=False) as continued:
                          assert set(original.files) == set(continued.files)
                          for array in original.files:
                              np.testing.assert_array_equal(original[array], continued[array])
                  else:
                      assert json.loads(original_path.read_bytes()) == json.loads(resumed_path.read_bytes())

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              for backend in ("numpy", "numba"):
                  parameters = SimulationParameters(
                      initial_temperature=1.0, num_particles=32, time_step=0.01,
                      num_steps=6, seed=42, backend=backend,
                  )
                  result = run_simulation(
                      parameters, task_id="container_" + backend,
                      attempt_id="runtime", artifacts_dir=root,
                  )
                  assert result["status"] == "completed"
                  verify_envelope(result, root)
                  verify_checkpoint_resume(parameters, result, root)
                  state_path = root / result["artifacts"]["final_state"]
                  with np.load(state_path, allow_pickle=False) as state:
                      states[backend] = state["velocities"].copy()
                  with (root / result["artifacts"]["manifest"]).open() as stream:
                      manifest = json.load(stream)
                  assert manifest["parameters"]["backend"] == backend
                  assert manifest["execution"]["backend"] == backend
                  assert hashlib.sha256(state_path.read_bytes()).hexdigest() == manifest["artifacts"][0]["sha256"]
                  manifests[backend] = manifest
              np.testing.assert_allclose(states["numba"], states["numpy"], rtol=1e-11, atol=1e-11)
              langevin_states = {}
              langevin_trajectories = {}
              langevin_manifests = {}
              for backend in ("numpy", "numba"):
                  parameters = LangevinParameters(
                      1.0, 1.0, 32, num_steps=100, time_step=0.1, sample_stride=10,
                      acceleration=(0.5, -0.25), boundary="periodic", box_size=(1.0, 1.0),
                      seed=42, backend=backend,
                  )
                  result = run_simulation(
                      parameters, task_id="langevin_" + backend,
                      attempt_id="runtime", artifacts_dir=root,
                  )
                  assert result["status"] == "completed" and result["model_version"] == "langevin-free-v1"
                  verify_envelope(result, root)
                  verify_checkpoint_resume(parameters, result, root)
                  assert set(result["artifacts"]) == {"manifest", "final_state", "trajectory", "transport"}
                  with (root / result["artifacts"]["manifest"]).open() as stream:
                      manifest = json.load(stream)
                  assert manifest["model"]["version"] == "langevin-free-v1"
                  assert manifest["parameters"]["backend"] == manifest["execution"]["backend"] == backend
                  assert manifest["parameters"]["acceleration"] == [0.5, -0.25]
                  assert manifest["sampling"]["coordinate_convention"] == "unwrapped"
                  records = {entry["path"]: entry for entry in manifest["artifacts"]}
                  for path, record in records.items():
                      assert hashlib.sha256((root / path).read_bytes()).hexdigest() == record["sha256"]
                  trajectory = load_trajectory_state(
                      root / result["artifacts"]["trajectory"],
                      expected_sha256=records[result["artifacts"]["trajectory"]]["sha256"],
                      expected_particles=parameters.num_particles,
                      expected_sample_steps=parameters.sampling_steps(),
                      expected_time_step=parameters.time_step,
                  )
                  assert trajectory["positions"].shape == (11, 32, 2)
                  assert trajectory["sample_steps"].dtype == np.int64
                  assert trajectory["times"].dtype == np.float64
                  with np.load(root / result["artifacts"]["final_state"], allow_pickle=False) as state:
                      arrays = {name: state[name].copy() for name in state.files}
                  assert set(arrays) == {"positions", "unwrapped_positions", "velocities"}
                  assert ((arrays["positions"] >= 0) & (arrays["positions"] < 1)).all()
                  np.testing.assert_allclose(arrays["positions"], np.remainder(arrays["unwrapped_positions"], 1.0))
                  np.testing.assert_array_equal(trajectory["positions"][-1], arrays["unwrapped_positions"])
                  assert (np.abs(trajectory["positions"]) > 1).any()
                  observed = analyze_transport(
                      trajectory["positions"], trajectory["sample_steps"], parameters=parameters
                  )
                  with (root / result["artifacts"]["transport"]).open() as stream:
                      saved = json.load(stream)
                  assert observed == saved
                  assert saved["msd"][-1] == result["final_msd"]
                  assert saved["centered_msd"][-1] == result["final_centered_msd"]
                  assert saved["diffusion"]["status"] == "available"
                  langevin_states[backend] = arrays
                  langevin_trajectories[backend] = trajectory["positions"]
                  langevin_manifests[backend] = manifest
              for name in ("positions", "unwrapped_positions", "velocities"):
                  np.testing.assert_allclose(langevin_states["numba"][name], langevin_states["numpy"][name], rtol=1e-11, atol=1e-11)
              np.testing.assert_allclose(langevin_trajectories["numba"], langevin_trajectories["numpy"], rtol=1e-11, atol=1e-11)
              lj_states = {}
              lj_trajectories = {}
              lj_manifests = {}
              for backend, interaction, ensemble in (
                  ("numpy", "direct", "nve"), ("numpy", "verlet", "nve"),
                  ("numba", "direct", "nve"), ("numba", "verlet", "nve"),
                  ("numba", "verlet", "nvt"),
              ):
                  variant = backend + "-" + interaction + "-" + ensemble
                  parameters = LennardJonesParameters(
                      num_particles=36, box_size=(8.0, 8.0), initial_temperature=0.1,
                      num_steps=6, time_step=0.001, sample_stride=1, seed=42,
                      backend=backend, interaction_backend=interaction, ensemble=ensemble,
                      **({"bath_temperature": 0.7} if ensemble == "nvt" else {}),
                  )
                  result = run_simulation(
                      parameters, task_id="lj_" + variant, attempt_id="runtime", artifacts_dir=root,
                  )
                  assert result["status"] == "completed" and result["model_version"] == "lennard-jones-2d-v1"
                  verify_envelope(result, root)
                  verify_checkpoint_resume(parameters, result, root)
                  assert result["potential_energy"] < 0 and result["total_energy"] < 0
                  assert set(result["artifacts"]) == {"manifest", "final_state", "trajectory", "observables"}
                  with (root / result["artifacts"]["manifest"]).open() as stream:
                      manifest = json.load(stream)
                  assert manifest["parameters"]["backend"] == manifest["execution"]["backend"] == backend
                  assert manifest["parameters"]["interaction_backend"] == interaction
                  assert manifest["model"]["version"] == "lennard-jones-2d-v1"
                  assert "shifted-force" in manifest["model"]["potential"]["name"]
                  assert "shifted-force" in manifest["execution"]["cutoff_policy"]
                  assert manifest["model"]["potential"]["tail_correction"] is None
                  assert manifest["model"]["initialization"]["canonical_sample"] is False
                  assert manifest["model"]["integrator"] == ("velocity-verlet" if ensemble == "nve" else "baoab")
                  records = {entry["path"]: entry for entry in manifest["artifacts"]}
                  for path, record in records.items():
                      assert hashlib.sha256((root / path).read_bytes()).hexdigest() == record["sha256"]
                  trajectory = load_trajectory_state(
                      root / result["artifacts"]["trajectory"],
                      expected_sha256=records[result["artifacts"]["trajectory"]]["sha256"],
                      expected_particles=parameters.num_particles,
                      expected_sample_steps=parameters.sampling_steps(),
                      expected_time_step=parameters.time_step,
                  )
                  assert trajectory["positions"].shape == (7, 36, 2)
                  with np.load(root / result["artifacts"]["final_state"], allow_pickle=False) as state:
                      arrays = {name: state[name].copy() for name in state.files}
                  assert set(arrays) == {"positions", "unwrapped_positions", "velocities"}
                  assert ((arrays["positions"] >= 0) & (arrays["positions"] < 8)).all()
                  np.testing.assert_array_equal(trajectory["positions"][-1], arrays["unwrapped_positions"])
                  with (root / result["artifacts"]["observables"]).open() as stream:
                      saved = json.load(stream)
                  series = {name: np.asarray(values, dtype=np.float64) for name, values in saved["series"].items()}
                  observed = analyze_lj_observables(
                      trajectory["positions"], trajectory["sample_steps"], series, parameters=parameters,
                  )
                  assert observed == saved
                  assert saved["series"]["total_energy"][-1] == result["total_energy"]
                  assert saved["series"]["pressure"][-1] == result["pressure"]
                  assert saved["rdf"]["dimensions"] == 2
                  assert saved["rdf"]["pair_checks"] == 36 * 35 // 2
                  assert saved["energy_drift"]["applicable"] is (ensemble == "nve")
                  if ensemble == "nvt":
                      assert manifest["parameters"]["friction"] == 1.0
                      assert manifest["model"]["thermostat"]["bath_temperature"] == 0.7
                  lj_states[variant] = arrays
                  lj_trajectories[variant] = trajectory["positions"]
                  lj_manifests[variant] = manifest
              for variant in ("numpy-verlet-nve", "numba-direct-nve", "numba-verlet-nve"):
                  for name in ("positions", "unwrapped_positions", "velocities"):
                      np.testing.assert_allclose(lj_states[variant][name], lj_states["numpy-direct-nve"][name], rtol=1e-10, atol=1e-10)
                  np.testing.assert_allclose(lj_trajectories[variant], lj_trajectories["numpy-direct-nve"], rtol=1e-10, atol=1e-10)
          for manifest in (manifests["numba"], langevin_manifests["numba"], lj_manifests["numba-direct-nve"], lj_manifests["numba-verlet-nve"]):
              execution = manifest["execution"]
              assert execution["backend_version"] == importlib.metadata.version("numba")
              assert execution["llvmlite_version"] == importlib.metadata.version("llvmlite")
              assert execution["llvm_version"]
              assert execution["device"] == "cpu" and execution["dtype"] == "float64"
              assert execution["fastmath"] is False and execution["parallel"] is False
              assert execution["cache"] is False and execution["nogil"] is True
          assert not any(name.split(".", 1)[0] in {"jax", "jaxlib"} for name in sys.modules)
          print("Optional Numba image: OU/Langevin/LJ exact checkpoint continuation, envelopes and saved CPU results")
          PYTHON

  optional-benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.optional_benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            experimental: false
          - python: "3.14t"
            experimental: true
    # Free-threaded compatibility remains informative until all backend wheels exist.
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Measure core backends
        run: |
          uv sync --frozen
          uv run --frozen --no-sync python scripts/benchmark.py --particles 256 --steps 10 --repeats 3 --workers 2 --backends numpy,threads,processes --output /tmp/benchmark-core.json
      - name: Measure optional JIT backends where supported
        run: |
          uv sync --frozen --extra benchmark
          uv run --frozen --no-sync python scripts/benchmark.py --particles 256 --steps 10 --repeats 3 --workers 2 --backends numpy,numba,jax --output /tmp/benchmark-jit.json
          uv run --frozen --no-sync python -c "import json; report = json.load(open('/tmp/benchmark-jit.json')); assert all(report['backends'][name]['status'] == 'passed' for name in ('numpy', 'numba', 'jax')), report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.python }}
          path: /tmp/benchmark-*.json
