name: Publish GitHub release

on:
  workflow_run:
    workflows: [Validate scientific API]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-api-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify main, successful CI and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --sha "$RELEASE_SHA" --check
      - name: Build distributions with the pinned backend
        run: |
          uv lock --check
          uv build
          git diff --exit-code -- uv.lock
      - name: Verify the installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/release-wheel"
          uv export --frozen --no-emit-project --output-file "$RUNNER_TEMP/release-core.txt"
          uv pip install --python "$RUNNER_TEMP/release-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/release-core.txt"
          uv pip install --python "$RUNNER_TEMP/release-wheel/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-wheel/bin/python" -I -c 'from importlib.metadata import version; import scientific_api; from scientific_api.main import app; assert scientific_api.__version__ == version("scientific-api"); assert app is not None'
      - name: Publish verified distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --sha "$RELEASE_SHA"
